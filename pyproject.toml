[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceflow"
version = "0.1.0"
description = "A local RAG knowledge assistant"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=5,<6",
    "transformers>=4.48,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The deselected cases and ignored modules below verify frozen historical artifacts
# (artifacts/, evals/, and one-off experiment scripts under experiments/) that are
# intentionally NOT published in this repository. The test files stay in the tree so the
# contracts remain documented; point them at the full internal workspace to run them.
addopts = """-ra
--deselect tests/test_e2e_dataset.py::test_old_pilot_dataset_still_validates
--deselect tests/test_e2e_dataset_script.py::test_refuses_existing_evals_file_even_with_overwrite
--ignore=tests/test_phase7_artifacts.py
--ignore=tests/test_phase9_runtime_promotion.py
--ignore=tests/test_phase10_reranker_performance.py
--ignore=tests/test_gold_stabilization.py
--ignore=tests/test_gold_mapping_v2.py
--ignore=tests/test_ir_metric_conformance.py
--ignore=tests/test_research_baseline_artifacts.py
--ignore=tests/test_debug_paths.py
"""
