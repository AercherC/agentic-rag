[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceflow"
version = "0.1.0"
description = "A local RAG knowledge assistant"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=5,<6",
    "transformers>=4.48,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
